<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050810">
<title>NEON DRIFT · GRAND PRIX</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <canvas id="gameCanvas"></canvas>

    <div id="hud" class="hidden">
        <div class="hud-top">
            <div class="hud-block">
                <div class="hud-label">SPEED</div>
                <div class="hud-big"><span id="speed">0</span><small>km/h</small></div>
                <div class="bar"><div id="speedFill"></div></div>
            </div>
            <div class="hud-block hud-center">
                <div class="hud-label">LAP</div>
                <div class="hud-big" id="lap">1 / 3</div>
                <div class="hud-sub" id="lapTime">00:00.00</div>
            </div>
            <div class="hud-block">
                <div class="hud-label">POSITION</div>
                <div class="hud-big" id="position">1<small>/6</small></div>
                <div class="hud-sub" id="gap">+0.00s</div>
            </div>
            <div class="hud-block">
                <div class="hud-label">NITRO</div>
                <div class="bar"><div id="nitroFill"></div></div>
                <div class="hud-sub" id="tire">MEDIUM</div>
                <button id="pauseBtn" class="icon-btn">❚❚</button>
            </div>
        </div>
    </div>

    <div id="countdown" class="countdown hidden"></div>

    <div id="touchControls" class="hidden">
        <div class="dpad">
            <button class="ctrl-btn dpad-left"  data-key="left"><svg viewBox="0 0 24 24" width="32" height="32"><path d="M15 4 L7 12 L15 20 Z" fill="currentColor"/></svg></button>
            <button class="ctrl-btn dpad-right" data-key="right"><svg viewBox="0 0 24 24" width="32" height="32"><path d="M9 4 L17 12 L9 20 Z" fill="currentColor"/></svg></button>
        </div>
        <div class="pedals">
            <button class="ctrl-btn nitro-btn" data-key="nitro">
                <svg viewBox="0 0 24 24" width="26" height="26"><path d="M13 2 L4 14 H11 L10 22 L20 10 H13 Z" fill="currentColor"/></svg>
                <span>NITRO</span>
            </button>
            <button class="ctrl-btn pedal-brake" data-key="brake">
                <svg viewBox="0 0 24 24" width="26" height="26"><rect x="4" y="6" width="16" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                <span>BRAKE</span>
            </button>
            <button class="ctrl-btn pedal-gas" data-key="gas">
                <svg viewBox="0 0 24 24" width="30" height="30"><rect x="4" y="6" width="16" height="12" rx="3" fill="currentColor"/></svg>
                <span>GAS</span>
            </button>
        </div>
    </div>

    <div id="startScreen" class="overlay">
        <div class="screen-content">
            <header class="brand">
                <div class="brand-mark">ND</div>
                <div class="brand-text">
                    <h1>NEON DRIFT</h1>
                    <p>GRAND PRIX · v5.0</p>
                </div>
            </header>

            <nav class="tabs">
                <button class="tab active" data-tab="garage">GARAGE</button>
                <button class="tab" data-tab="modes">RACE MODES</button>
                <button class="tab" data-tab="achv">ACHIEVEMENTS</button>
                <button class="tab" data-tab="stats">STATS</button>
                <button class="tab" data-tab="settings">SETTINGS</button>
            </nav>

            <div class="tab-panel active" id="tab-garage">
                <div class="class-filter" id="classFilter"></div>
                <div class="garage-layout">
                    <div class="cars-list" id="carsGrid"></div>
                    <div class="car-showcase" id="carShowcase">
                        <div class="showcase-stage">
                            <canvas id="showcaseCanvas"></canvas>
                            <div class="showcase-glow"></div>
                        </div>
                        <div class="showcase-info" id="carInfo"></div>
                        <div class="showcase-custom" id="customRow">
                            <div class="custom-block">
                                <label>BODY</label>
                                <div class="swatches" id="colorSwatches"></div>
                            </div>
                            <div class="custom-block">
                                <label>NEON</label>
                                <div class="swatches" id="neonSwatches"></div>
                            </div>
                            <div class="custom-block">
                                <label>WHEELS</label>
                                <div class="wheels" id="wheelPicks"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-panel" id="tab-modes">
                <div class="modes-grid" id="modesGrid"></div>
                <div class="modes-detail">
                    <div class="mode-group">
                        <h3>TRACK</h3>
                        <div class="track-picker" id="trackPicker"></div>
                    </div>
                    <div class="mode-group">
                        <h3>TIRE</h3>
                        <div class="tire-picker" id="tirePicker"></div>
                    </div>
                </div>
            </div>

            <div class="tab-panel" id="tab-achv"><div class="achv-grid" id="achvGrid"></div></div>
            <div class="tab-panel" id="tab-stats">
                <div class="stats-grid" id="statsGrid"></div>
                <button class="btn-ghost" id="resetStats">RESET STATS</button>
            </div>
            <div class="tab-panel" id="tab-settings">
                <div class="settings-list">
                    <label class="setting"><input type="checkbox" id="soundOn" checked><span>Sound</span></label>
                    <label class="setting"><span>Volume</span><input type="range" id="volume" min="0" max="100" value="60"></label>
                    <label class="setting"><input type="checkbox" id="musicOn" checked><span>Music</span></label>
                    <label class="setting"><input type="checkbox" id="ghostOn" checked><span>Ghost replay</span></label>
                    <label class="setting"><input type="checkbox" id="touchOn" checked><span>Touch controls</span></label>
                    <label class="setting"><input type="checkbox" id="shakeOn" checked><span>Vibration</span></label>
                </div>
            </div>

            <footer class="start-footer">
                <div class="controls-hint">
                    <span><kbd>←</kbd><kbd>→</kbd> steering</span>
                    <span><kbd>↑</kbd> throttle</span>
                    <span><kbd>↓</kbd> brake</span>
                    <span><kbd>SHIFT</kbd> nitro</span>
                    <span><kbd>SPACE</kbd> pause</span>
                </div>
                <button id="startBtn" class="btn-primary">START RACE</button>
            </footer>
        </div>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <div class="screen-content narrow">
            <h1 class="title-fail" id="raceResultTitle">RACE FINISHED</h1>
            <div class="results" id="resultsGrid"></div>
            <div id="newRecord" class="new-record hidden">NEW RECORD</div>
            <div id="achvToast" class="achv-toast hidden"></div>
            <div class="result-actions">
                <button id="restartBtn" class="btn-primary">RESTART</button>
                <button id="menuBtn" class="btn-ghost">GARAGE</button>
            </div>
        </div>
    </div>

    <div id="pauseScreen" class="overlay hidden">
        <div class="screen-content narrow">
            <h1 class="title-pause">PAUSED</h1>
            <div class="result-actions">
                <button id="resumeBtn" class="btn-primary">RESUME</button>
                <button id="quitBtn" class="btn-ghost">EXIT TO GARAGE</button>
            </div>
        </div>
    </div>
</div>

<script src="cars.js"></script>
<script src="physics.js"></script>
<script src="tracks.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
